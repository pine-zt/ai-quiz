<!DOCTYPE html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>小挽制作的神秘传承之卷</title>
<style>
/* ============================================================
   小挽制作的神秘传承之卷  —  样式表
   两个皮肤：ink（暗夜霓虹）/ paper（纸白）
   ============================================================ */

:root {
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --maxw: 920px;
  --font: "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "Consolas", "SFMono-Regular", monospace;
  --ease: cubic-bezier(.22, .8, .28, 1);
}

/* ---------- 暗夜霓虹 ---------- */
:root[data-theme="ink"] {
  color-scheme: dark;
  --bg: #0b0d12;
  --bg-soft: #10131b;
  --panel: rgba(255, 255, 255, 0.045);
  --panel-solid: #141824;
  --panel-hover: rgba(255, 255, 255, 0.075);
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #eef1f7;
  --text-2: #c3cad9;
  --muted: #8d95a8;
  --accent: #ff4d8d;
  --accent-2: #54e0ff;
  --accent-soft: rgba(255, 77, 141, 0.14);
  --accent-grad: linear-gradient(120deg, #ff4d8d 0%, #a06bff 48%, #54e0ff 100%);
  --ok: #3ddc97;
  --ok-soft: rgba(61, 220, 151, 0.13);
  --bad: #ff6b6b;
  --bad-soft: rgba(255, 107, 107, 0.13);
  --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.75);
  --hero-glow: radial-gradient(60% 60% at 18% 0%, rgba(255, 77, 141, 0.28), transparent 70%),
               radial-gradient(50% 50% at 90% 10%, rgba(84, 224, 255, 0.18), transparent 70%);
}

/* ---------- 纸白 ---------- */
:root[data-theme="paper"] {
  color-scheme: light;
  --bg: #f6f2e9;
  --bg-soft: #efe9dc;
  --panel: rgba(255, 255, 255, 0.72);
  --panel-solid: #fffdf8;
  --panel-hover: rgba(255, 255, 255, 0.95);
  --line: rgba(60, 48, 32, 0.12);
  --line-strong: rgba(60, 48, 32, 0.22);
  --text: #241f18;
  --text-2: #4b4236;
  --muted: #7c7263;
  --accent: #c0392b;
  --accent-2: #2f6f6a;
  --accent-soft: rgba(192, 57, 43, 0.1);
  --accent-grad: linear-gradient(120deg, #c0392b 0%, #a4552f 55%, #2f6f6a 100%);
  --ok: #2e7d5b;
  --ok-soft: rgba(46, 125, 91, 0.12);
  --bad: #b3372c;
  --bad-soft: rgba(179, 55, 44, 0.1);
  --shadow: 0 24px 50px -28px rgba(70, 52, 30, 0.45);
  --hero-glow: radial-gradient(60% 60% at 15% 0%, rgba(192, 57, 43, 0.12), transparent 70%),
               radial-gradient(50% 50% at 95% 5%, rgba(47, 111, 106, 0.1), transparent 70%);
}

* { box-sizing: border-box; }

/* ---------- 字体选项 ---------- */
:root[data-font="serif"] { --font: "Songti SC", "SimSun", "Noto Serif SC", Georgia, serif; }
:root[data-font="kai"] { --font: "KaiTi", "STKaiti", "Kaiti SC", "楷体", serif; }
:root[data-font="mono"] { --font: var(--mono); }
.font-seg button { font-size: 13.5px; }
.font-seg button[data-font="serif"] { font-family: "Songti SC", "SimSun", serif; }
.font-seg button[data-font="kai"] { font-family: "KaiTi", "STKaiti", serif; }
.font-seg button[data-font="mono"] { font-family: var(--mono); }

/* ---------- 自定义背景图 ---------- */
:root { --user-bg: none; --bg-veil: rgba(6, 8, 14, 0.62); }
:root[data-theme="paper"] { --bg-veil: rgba(250, 247, 240, 0.74); }
html.has-bg body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(var(--bg-veil), var(--bg-veil)), var(--user-bg) center / cover no-repeat;
  background-color: var(--bg);
  filter: blur(2px) saturate(1.05);
  transform: scale(1.03);
}
html.has-bg .topbar {
  background: linear-gradient(180deg, rgba(6, 8, 14, 0.52), rgba(6, 8, 14, 0.16));
  backdrop-filter: blur(8px) saturate(1.1);
  -webkit-backdrop-filter: blur(8px) saturate(1.1);
  border-bottom-color: rgba(255, 255, 255, 0.10);
}
html[data-theme="paper"].has-bg .topbar {
  background: linear-gradient(180deg, rgba(250, 247, 240, 0.88), rgba(250, 247, 240, 0.42));
  border-bottom-color: rgba(30, 30, 30, 0.08);
}
html.has-bg .hero { background-color: color-mix(in srgb, var(--panel-solid) 62%, transparent); }
html.has-bg .chapter-card,
html.has-bg .stat,
html.has-bg .panel,
html.has-bg .q-card { background-color: color-mix(in srgb, var(--panel-solid) 86%, transparent); }
.look-preview {
  width: 100%; height: 150px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--bg-soft) center / cover no-repeat; display: grid; place-items: center;
  color: var(--muted); font-size: 12.5px; overflow: hidden;
}
.look-preview.has-img { color: transparent; }
.avatar-row.look-row { align-items: center; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  padding-bottom: 40px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--hero-glow);
  opacity: 0.9;
  pointer-events: none;
  z-index: 0;
}

a { color: inherit; text-decoration: none; }

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }

::selection { background: var(--accent-soft); }

/* ---------------- 顶栏 ---------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}

.topbar-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 13px 22px;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

.brand-mark {
  width: 40px; height: 40px;
  display: block;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 22px -8px var(--accent);
  flex: none;
}
.brand-mark svg { display: block; width: 100%; height: 100%; }

.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-text strong { font-size: 15px; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.brand-text small { color: var(--muted); font-size: 11.5px; letter-spacing: 0.2px; }

.nav { display: flex; gap: 4px; margin-left: auto; }

.nav a {
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 13.5px;
  color: var(--muted);
  transition: all .2s var(--ease);
  white-space: nowrap;
}

.nav a:hover { color: var(--text); background: var(--panel-hover); }
.nav a.active { color: var(--text); background: var(--panel-hover); box-shadow: inset 0 0 0 1px var(--line); }

.topbar-actions { display: flex; align-items: center; gap: 8px; }

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  transition: all .2s var(--ease);
}
.icon-btn:hover { background: var(--panel-hover); border-color: var(--line-strong); transform: translateY(-1px); }

/* ---------------- 主体 ---------------- */
.view {
  position: relative;
  z-index: 1;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 10px 22px 60px;
  animation: rise .35s var(--ease);
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ---------------- 首页 hero ---------------- */
.hero {
  position: relative;
  padding: 44px 34px 40px;
  border-radius: 26px;
  border: 1px solid var(--line);
  background: var(--panel);
  overflow: hidden;
  margin-bottom: 22px;
}

.hero::after {
  content: "";
  position: absolute;
  width: 460px; height: 460px;
  right: -180px; top: -220px;
  background: radial-gradient(circle, var(--accent-soft), transparent 65%);
  pointer-events: none;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}

.eyebrow::before {
  content: "";
  width: 22px; height: 1px;
  background: var(--accent);
  display: inline-block;
}

.hero h1 {
  margin: 0 0 12px;
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1.15;
  letter-spacing: -0.5px;
  font-weight: 800;
}

.hero h1 .glow {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p { margin: 0 0 26px; color: var(--muted); max-width: 560px; font-size: 14.5px; }

.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all .18s var(--ease);
  white-space: nowrap;
  user-select: none;
}

.btn:active { transform: translateY(1px) scale(.99); }

.btn-primary {
  color: #fff;
  background: var(--accent-grad);
  box-shadow: 0 12px 28px -14px var(--accent);
}
.btn-primary:hover { filter: brightness(1.06); box-shadow: 0 16px 34px -14px var(--accent); }

.btn-ghost {
  background: var(--panel);
  border-color: var(--line);
  color: var(--text-2);
}
.btn-ghost:hover { background: var(--panel-hover); border-color: var(--line-strong); color: var(--text); }

.btn-sm { padding: 7px 14px; font-size: 13px; }
.btn:disabled { opacity: .45; pointer-events: none; }

/* ---------------- 数据条 ---------------- */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 26px;
}

.stat {
  padding: 16px 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--panel);
}
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: 0.3px; }
.stat .v { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }

/* ---------------- 区块标题 ---------------- */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 30px 2px 14px;
}
.section-head h2 { margin: 0; font-size: 17px; letter-spacing: 0.2px; }
.section-head .hint { color: var(--muted); font-size: 12.5px; }

/* ---------------- 章节卡 ---------------- */
.chapter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.chapter-card {
  padding: 18px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  transition: all .2s var(--ease);
  position: relative;
  overflow: hidden;
}
.ch-resume {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 6px; font-size: 11.5px; color: var(--accent-2);
}
.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--accent); font: inherit; font-size: 11.5px;
  text-decoration: underline; text-underline-offset: 2px;
}
.chapter-card:hover { background: var(--panel-hover); border-color: var(--line-strong); transform: translateY(-2px); }

.ch-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.ch-name { font-weight: 700; font-size: 15px; }
.ch-count { font-size: 12px; color: var(--muted); }
.ch-desc { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }

.ch-bar { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.ch-bar span { display: block; height: 100%; border-radius: 99px; background: var(--accent-grad); transition: width .5s var(--ease); }

/* ---------------- 题目卡 ---------------- */
.quiz-shell { max-width: 760px; margin: 0 auto; }

.quiz-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin: 6px 2px 14px; color: var(--muted); font-size: 12.5px;
}

.progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 20px; }
.progress span { display: block; height: 100%; background: var(--accent-grad); border-radius: 99px; transition: width .35s var(--ease); }

.q-card {
  padding: 26px 28px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: var(--shadow);
}

.q-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

.tag {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: var(--bg-soft);
  white-space: nowrap;
}
.tag.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }

.q-stem { font-size: 17px; line-height: 1.7; font-weight: 600; margin: 0 0 16px; }
.q-stem code, .q-code, .exp code { font-family: var(--mono); font-size: 0.92em; }

.q-code {
  margin: 0 0 18px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: var(--bg-soft);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 13px;
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre;
}

.options { display: flex; flex-direction: column; gap: 10px; }

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--text-2);
  cursor: pointer;
  transition: all .16s var(--ease);
  line-height: 1.6;
}

.option:hover { border-color: var(--line-strong); background: var(--panel-hover); color: var(--text); }

.option .key {
  flex: none;
  width: 22px; height: 22px;
  border-radius: 7px;
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  margin-top: 1px;
}

.option.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.option.selected .key { border-color: var(--accent); color: var(--accent); }

.option.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--text); }
.option.correct .key { border-color: var(--ok); color: var(--ok); }

.option.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--text); }
.option.wrong .key { border-color: var(--bad); color: var(--bad); }

.option.locked { cursor: default; }

.fill-row { display: flex; gap: 10px; margin-top: 4px; }
.fill-input {
  flex: 1;
  min-width: 0;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--bg-soft);
  outline: none;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.fill-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fill-input.correct { border-color: var(--ok); }
.fill-input.wrong { border-color: var(--bad); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.actions .spacer { flex: 1; }
.actions .kbd-hint { color: var(--muted); font-size: 11.5px; }

/* ---------------- 解析 ---------------- */
.explain {
  margin-top: 22px;
  padding: 18px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--bg-soft);
  animation: rise .25s var(--ease);
}

.explain-head {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 14px; margin-bottom: 10px;
}
.explain-head .verdict { font-size: 12px; padding: 2px 9px; border-radius: 999px; }
.verdict.ok { color: var(--ok); background: var(--ok-soft); }
.verdict.no { color: var(--bad); background: var(--bad-soft); }

.exp-block { color: var(--text-2); font-size: 13.5px; margin: 8px 0; }
.exp-block b { color: var(--text); }
.exp-block .li { display: flex; gap: 8px; margin: 5px 0; }
.exp-block .li i { font-style: normal; color: var(--muted); flex: none; }
.exp-src { color: var(--muted); font-size: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }

/* ---------------- 结果页 ---------------- */
.result { text-align: center; padding: 46px 26px; }
.result .score { font-size: 64px; font-weight: 800; letter-spacing: -2px; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.1; }
.result .score small { font-size: 18px; color: var(--muted); -webkit-text-fill-color: var(--muted); font-weight: 500; }
.result h2 { margin: 10px 0 6px; font-size: 20px; }
.result p { color: var(--muted); margin: 0 0 24px; }

/* ---------------- 错题本 / 列表 ---------------- */
.list { display: flex; flex-direction: column; gap: 10px; }

.review-item {
  padding: 16px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--panel);
  display: flex;
  gap: 14px;
  align-items: flex-start;
  cursor: pointer;
  transition: all .18s var(--ease);
}
.review-item:hover { background: var(--panel-hover); border-color: var(--line-strong); }

.review-item .no {
  flex: none; width: 30px; height: 30px;
  border-radius: 9px;
  display: grid; place-items: center;
  background: var(--bad-soft);
  color: var(--bad);
  font-weight: 700; font-size: 13px;
}
.review-item .body { min-width: 0; flex: 1; }
.review-item .stem { font-size: 14px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.review-item .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-md);
}
.empty .big { font-size: 34px; margin-bottom: 10px; }

/* ---------------- 数据页 ---------------- */
.panel {
  padding: 22px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: var(--panel);
  margin-bottom: 16px;
}

.bar-row { display: grid; grid-template-columns: 120px 1fr 52px; gap: 12px; align-items: center; margin: 10px 0; font-size: 13px; }
.bar-row .name { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar-row .track span { display: block; height: 100%; border-radius: 99px; background: var(--accent-grad); }
.bar-row .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; }
.kv .item { padding: 14px 16px; border-radius: var(--radius-sm); background: var(--bg-soft); border: 1px solid var(--line); }
.kv .item .k { color: var(--muted); font-size: 12px; }
.kv .item .v { font-size: 20px; font-weight: 700; margin-top: 2px; }

.source-list { display: grid; gap: 8px; color: var(--text-2); font-size: 13px; }
.source-list .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.source-list .row:last-child { border-bottom: 0; }
.source-list .row span:last-child { color: var(--muted); }

/* ---------------- 页脚 / 提示 ---------------- */
.footer {
  position: relative;
  z-index: 1;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 26px 22px 40px;
  color: var(--muted);
  font-size: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.footer .dot { opacity: .5; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 20px);
  background: var(--panel-solid);
  color: var(--text);
  border: 1px solid var(--line-strong);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: all .25s var(--ease);
  z-index: 50;

  function rawCfg() {
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; }
  }

    var c = rawCfg();

      var u = this.user();
      if (!u) return Promise.reject(new Error("未登录"));
      return req("/rest/v1/quiz_state?on_conflict=user_id", {
        method: "POST",
        prefer: "resolution=merge-duplicates,return=minimal",
        body: { user_id: u.id, data: data, updated_at: new Date().toISOString() }
      });
    }
  };
})();

</script>
<script>
/* ============================================================
   小挽制作的神秘传承之卷  —  逻辑
   纯原生 JS，无依赖；进度存 localStorage
   ============================================================ */
(function () {
  "use strict";

  var QUESTIONS = window.QUESTIONS || [];
  var CHAPTERS = window.QUIZ_CHAPTERS || [];
  var QMAP = {};
  QUESTIONS.forEach(function (q) { QMAP[q.id] = q; });

  var LS_KEY = "aiq.v1";
  var view = document.getElementById("view");
  var nav = document.getElementById("nav");
  var toastEl = document.getElementById("toast");
  var themeBtn = document.getElementById("themeBtn");
  var themeIcon = document.getElementById("themeIcon");
  var footCount = document.getElementById("footCount");
  var acctBtn = document.getElementById("acctBtn");
  var acctIcon = document.getElementById("acctIcon");
  var acctImg = document.getElementById("acctImg");
  var acctDot = document.getElementById("acctDot");
  var modal = document.getElementById("modal");
  var modalBody = document.getElementById("modalBody");

  /* ---------------- 状态 ---------------- */
  function defaultState() {
    return {
      v: 1,
      attempts: {},
      skin: "ink",
      streak: 0,
      bestStreak: 0,
      days: {},
      profile: {},
      look: { img: "", ts: 0 },
    };
  }

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return defaultState();
      var s = JSON.parse(raw);
      var d = defaultState();
      return Object.assign(d, s, { attempts: s.attempts || {}, days: s.days || {}, profile: s.profile || {}, look: s.look || { img: "", ts: 0 } });
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* 忽略 */ }
  }

  function todayKey() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  /* ---------------- 统计 ---------------- */
  function attemptOf(id) {
    return state.attempts[id] || { r: 0, w: 0, last: null, ts: 0 };
  }

  function totalDone() {
    var n = 0;
    Object.keys(state.attempts).forEach(function (id) { var a = state.attempts[id]; n += a.r + a.w; });
    return n;
  }

  function totalRight() {
    var n = 0;
    Object.keys(state.attempts).forEach(function (id) { n += state.attempts[id].r || 0; });
    return n;
  }

  function accuracy() {
    var done = totalDone();
    return done ? Math.round((totalRight() / done) * 100) : 0;
  }

  function wrongIds() {
    return Object.keys(state.attempts).filter(function (id) {
      var a = state.attempts[id];
      return a.last === "wrong" && QMAP[id];
    }).sort(function (a, b) {
      return (state.attempts[b].ts || 0) - (state.attempts[a].ts || 0);
    });
  }

  function chapterStats(chId) {
    var list = QUESTIONS.filter(function (q) { return q.ch === chId; });
    var r = 0, w = 0;
    list.forEach(function (q) {
      var a = state.attempts[q.id];
      if (a) { r += a.r || 0; w += a.w || 0; }
    });
    var done = r + w;
    return {
      total: list.length,
      done: done,
      right: r,
      wrong: w,
      acc: done ? Math.round((r / done) * 100) : null,
      coverage: list.length ? Math.round((Object.keys(state.attempts).filter(function (id) { return QMAP[id] && QMAP[id].ch === chId; }).length / list.length) * 100) : 0
    };
  }

  function record(id, correct) {
    var a = attemptOf(id);
    a.r = a.r || 0;
    a.w = a.w || 0;
    if (correct) { a.r += 1; a.last = "right"; state.streak += 1; }
    else { a.w += 1; a.last = "wrong"; state.streak = 0; }
    a.ts = Date.now();
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.attempts[id] = a;

    var key = todayKey();
    var d = state.days[key] || { n: 0, c: 0 };
    d.n += 1;
    if (correct) d.c += 1;
    state.days[key] = d;
    save();
    scheduleSync();
  }

  /* ---------------- 工具 ---------------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function pct(n) { return (n == null ? "—" : n + "%"); }

  function typeLabel(t) {
    return { single: "单选", multi: "多选", judge: "判断", fill: "填空" }[t] || t;
  }

  function diffLabel(d) {
    return ["", "基础", "进阶", "挑战"][d] || "基础";
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function hashTo() {
    var h = (location.hash || "#/home").replace(/^#/, "");
    if (h.indexOf("/") !== 0) h = "/" + h;
    return h;
  }

  function go(path) {
    if (hashTo() === path) render();
    else location.hash = path;
  }

  /* ---------------- 会话 ---------------- */
  var session = null;   // { key, ids, idx, title, mode, picked, graded, results }
  var resultData = null;
  var initialSync = null;
  var initialSyncDone = false;

  /* 练习进度：按 key 存在本机，退出/刷新后能接着做 */
  var RESUME_KEY = "aiq.resume";

  function loadResumes() {
    try {
      var o = JSON.parse(localStorage.getItem(RESUME_KEY) || "{}");
      return o && typeof o === "object" ? o : {};
    } catch (e) { return {}; }
  }

  function resumeFor(key) {
    if (!key) return null;
    var r = loadResumes()[key];
    if (!r || !r.ids || !r.ids.length || r.idx >= r.ids.length) return null;
    return r;
  }

  function writeResumes(o) {
    o = o || {};
    if (typeof o !== "object") o = {};
    var now = Date.now();
    Object.keys(o).forEach(function (k) {
      if (o[k] && o[k].deleted && now - (o[k].ts || 0) > 7 * 864e5) delete o[k];
    });
    var keys = Object.keys(o).sort(function (a, b) { return (o[b].ts || 0) - (o[a].ts || 0); });
    keys.slice(8).forEach(function (k) { delete o[k]; });
    try { localStorage.setItem(RESUME_KEY, JSON.stringify(o)); } catch (e) {}
  }

  function saveResume() {
    if (!session || !session.key) return;
    var answered = session.graded || (session.picked && session.picked.length) || session.idx > 0;
    if (!answered) return;
    var o = loadResumes();
    o[session.key] = {
      ids: session.ids, idx: session.idx, title: session.title, mode: session.mode,
      picked: session.picked, graded: session.graded, results: session.results, ts: Date.now()
    };
    writeResumes(o);
    scheduleSync();
  }

  function dropResume(key) {
    if (!key) return;
    var o = loadResumes();
    o[key] = { ids: [], ts: Date.now(), deleted: 1 };
    writeResumes(o);
    scheduleSync();
  }

  function latestResume() {
    var o = loadResumes(), best = null;
    Object.keys(o).forEach(function (k) {
      var r = o[k];
      if (!r || !r.ids || r.idx >= r.ids.length) return;
      if (!best || (r.ts || 0) > (best.ts || 0)) { r.key = k; best = r; }
    });
    return best;
  }

  function resumeLine(ch) {
    var r = resumeFor("ch:" + ch);
    if (!r) return "";
    return '<div class="ch-resume">上次做到 ' + (r.idx + 1) + '/' + r.ids.length +
      '<button class="linkbtn" data-act="restart-ch" data-ch="' + esc(ch) + '">重新开始</button></div>';
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startSession(ids, title, mode, key) {
    if (!ids.length) { toast("这里还没有题目"); return; }
    if (!initialSyncDone && initialSync) {
      toast("正在同步云端进度，约一秒后再点一次");
      initialSync.then(function () { render(); });
      return;
    }
    key = key || "";
    var r = key ? resumeFor(key) : null;
    if (r) {
      session = {
        key: key, ids: r.ids, idx: r.idx, title: r.title, mode: r.mode || mode || "practice",
        picked: r.picked || [], graded: !!r.graded, results: r.results || []
      };
      resultData = null;
      toast("接着上次 · 第 " + (session.idx + 1) + " 题");
      go("/quiz");
      return;
    }
    session = { key: key, ids: ids, idx: 0, title: title, mode: mode || "practice", picked: [], graded: false, results: [] };
    resultData = null;
    go("/quiz");
  }

  function smartIds(n) {
    n = n || 10;
    var wrong = wrongIds();
    var seen = Object.keys(state.attempts);
    var unseen = QUESTIONS.filter(function (q) { return seen.indexOf(q.id) < 0; }).map(function (q) { return q.id; });
    var rest = QUESTIONS.filter(function (q) { return seen.indexOf(q.id) >= 0 && wrong.indexOf(q.id) < 0; }).map(function (q) { return q.id; });

    var picked = [];
    shuffle(wrong).forEach(function (id) { if (picked.length < Math.min(4, n)) picked.push(id); });
    shuffle(unseen).forEach(function (id) { if (picked.length < n) picked.push(id); });
    shuffle(rest).forEach(function (id) { if (picked.length < n) picked.push(id); });
    shuffle(wrong).forEach(function (id) { if (picked.length < n && picked.indexOf(id) < 0) picked.push(id); });
    return picked.slice(0, n);
  }

  function chapterIds(ch) {
    return QUESTIONS.filter(function (q) { return q.ch === ch; }).map(function (q) { return q.id; });
  }

  function currentQ() {
    return session ? QMAP[session.ids[session.idx]] : null;
  }

  /* ---------------- 判分 ---------------- */
  function norm(s) {
    return String(s == null ? "" : s)
      .trim().toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[“”"'`]/g, "")
      .replace(/[，、；]/g, ",");
  }

  function checkFill(q, input) {
    var v = norm(input);
    if (!v) return false;
    var list = (q.accept || []).map(norm);
    if (q.answer && typeof q.answer[0] === "string") list = list.concat(q.answer.map(norm));
    return list.indexOf(v) >= 0;
  }

  function isCorrect(q, picked) {
    if (q.type === "fill") return checkFill(q, picked[0] || "");
    if (q.type === "multi") {
      var a = q.answer.slice().sort().join(",");
      var b = picked.slice().sort().join(",");
      return a === b;
    }
    return picked.length === 1 && picked[0] === q.answer[0];
  }

  /* ---------------- 视图：首页 ---------------- */
  function greeting() {
    var h = new Date().getHours();
    if (h < 6) return "夜深了";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }

  function renderHome() {
    var done = totalDone();
    var acc = accuracy();
    var wrong = wrongIds().length;
    var cov = Math.round((Object.keys(state.attempts).filter(function (id) { return QMAP[id]; }).length / QUESTIONS.length) * 100);

    var cards = CHAPTERS.map(function (c) {
      var s = chapterStats(c.id);
      return (
        '<div class="chapter-card" data-act="start-ch" data-ch="' + c.id + '" role="button" tabindex="0">' +
          '<div class="ch-head"><span class="ch-name">' + esc(c.name) + '</span>' +
          '<span class="ch-count">' + s.total + ' 题</span></div>' +
          '<div class="ch-desc">' + esc(c.desc) + '</div>' +
          '<div class="ch-bar"><span style="width:' + s.coverage + '%"></span></div>' +
          '<div class="ch-desc" style="margin:8px 0 0;font-size:11.5px">' +
            (s.done ? '正确率 ' + pct(s.acc) + ' · 已做 ' + s.done + ' 次' : '未开始') +
          '</div>' +
          resumeLine(c.id) +
        '</div>'
      );
    }).join("");

    view.innerHTML =
      '<section class="hero">' +
        '<div class="eyebrow">Computer &amp; AI · 题库</div>' +
        '<h1>' + greeting() + '，<span class="glow">今天练几道？</span></h1>' +
        '<p>题目覆盖《计算机与人工智能》9 个讲次的核心知识点，做错自动收进错题本，连续答对会累积连击。</p>' +
        '<div class="hero-actions">' +
          '<button class="btn btn-primary" data-act="start-smart">开始智能练习 →</button>' +
          '<button class="btn btn-ghost" data-act="start-review">重练错题' + (wrong ? '（' + wrong + '）' : '') + '</button>' +
        '</div>' +
      '</section>' +

      '<div class="stat-row">' +
        '<div class="stat"><div class="k">累计答题</div><div class="v">' + done + '<small>次</small></div></div>' +
        '<div class="stat"><div class="k">正确率</div><div class="v">' + acc + '<small>%</small></div></div>' +
        '<div class="stat"><div class="k">错题</div><div class="v">' + wrong + '<small>道</small></div></div>' +
        '<div class="stat"><div class="k">当前连击</div><div class="v">' + state.streak + '<small>连对</small></div></div>' +
      '</div>' +

      '<div class="section-head"><h2>按章练习</h2><span class="hint">已覆盖 ' + cov + '% 的题目</span></div>' +
      '<div class="chapter-grid">' + cards + '</div>' +

      '<div class="section-head"><h2>怎么练</h2><span class="hint">三条路线</span></div>' +
      '<div class="panel" style="margin:0">' +
        '<div class="source-list">' +
          '<div class="row"><span>智能练习</span><span>优先错题，其次没做过的，再随机抽满 10 题</span></div>' +
          '<div class="row"><span>按章练习</span><span>按讲次顺序逐题过，适合课后自测</span></div>' +
          '<div class="row"><span>错题本</span><span>答错自动收录，重做答对后自动移出</span></div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- 视图：练习入口 ---------------- */
  function renderPractice() {
    var cards = CHAPTERS.map(function (c) {
      var s = chapterStats(c.id);
      return (
        '<div class="chapter-card" data-act="start-ch" data-ch="' + c.id + '" role="button" tabindex="0">' +
          '<div class="ch-head"><span class="ch-name">' + esc(c.name) + '</span><span class="ch-count">' + s.total + ' 题</span></div>' +
          '<div class="ch-desc">' + esc(c.desc) + '</div>' +
          '<div class="ch-bar"><span style="width:' + s.coverage + '%"></span></div>' +
          '<div class="ch-desc" style="margin:8px 0 0;font-size:11.5px">' +
            (s.done ? '正确率 ' + pct(s.acc) + ' · 已做 ' + s.done + ' 次' : '未开始') +
          '</div>' +
          resumeLine(c.id) +
        '</div>'
      );
    }).join("");

    view.innerHTML =
      '<div class="section-head" style="margin-top:6px"><h2>练习</h2><span class="hint">共 ' + QUESTIONS.length + ' 题 · ' + CHAPTERS.length + ' 个讲次</span></div>' +
      '<div class="panel">' +
        '<div class="kv">' +
          '<div class="item"><div class="k">题库总量</div><div class="v">' + QUESTIONS.length + '</div></div>' +
          '<div class="item"><div class="k">已作答（次）</div><div class="v">' + totalDone() + '</div></div>' +
          '<div class="item"><div class="k">错题待复习</div><div class="v">' + wrongIds().length + '</div></div>' +
        '</div>' +
        '<div class="actions"><button class="btn btn-primary" data-act="start-smart">智能练习（10 题）</button>' +
        '<button class="btn btn-ghost" data-act="start-review">重练错题</button></div>' +
      '</div>' +
      '<div class="section-head"><h2>按章练习</h2><span class="hint">共 ' + CHAPTERS.length + ' 个讲次</span></div>' +
      '<div class="chapter-grid">' + cards + '</div>';
  }

  /* ---------------- 视图：答题 ---------------- */
  function renderQuiz() {
    if (!session) { go("/practice"); return; }
    var q = currentQ();
    if (!q) { finishSession(); return; }

    var total = session.ids.length;
    var n = session.idx + 1;
    var head =
      '<div class="quiz-top"><span>' + esc(session.title) + '</span><span>' + n + ' / ' + total + '</span></div>' +
      '<div class="progress"><span style="width:' + Math.round((n - 1) / total * 100) + '%"></span></div>';

    var meta =
      '<div class="q-meta">' +
        '<span class="tag accent">' + esc(typeLabel(q.type)) + '</span>' +
        '<span class="tag">' + esc(q.sec) + '</span>' +
        '<span class="tag">' + esc(diffLabel(q.diff)) + '</span>' +
      '</div>';

    var code = q.code ? '<pre class="q-code">' + esc(q.code) + '</pre>' : '';
    var body = "";

    if (q.type === "fill") {
      var val = session.picked[0] || "";
      var cls = "";
      if (session.graded) cls = isCorrect(q, session.picked) ? " correct" : " wrong";
      body =
        '<div class="fill-row">' +
          '<input class="fill-input' + cls + '" id="fillInput" type="text" autocomplete="off" ' +
            'placeholder="输入答案后点提交" value="' + esc(val) + '" ' + (session.graded ? "disabled" : "") + '>' +
        '</div>';
    } else {
      body = '<div class="options">' + q.options.map(function (opt, i) {
        var cls = "option";
        var key = q.type === "judge" ? (i === 0 ? "✓" : "✗") : String.fromCharCode(65 + i);
        var picked = session.picked.indexOf(i) >= 0;
        if (picked) cls += " selected";
        if (session.graded) {
          cls += " locked";
          if (q.answer.indexOf(i) >= 0) cls += " correct";
          else if (picked) cls += " wrong";
        }
        return '<button class="' + cls + '" data-act="opt" data-i="' + i + '"' + (session.graded ? " disabled" : "") + '>' +
          '<span class="key">' + key + '</span><span>' + esc(opt) + '</span></button>';
      }).join("") + '</div>';
    }

    var actions = session.graded
      ? '<div class="actions"><button class="btn btn-primary" data-act="next">' + (n < total ? "下一题 →" : "查看结果 →") + '</button>' +
        '<button class="btn btn-ghost" data-act="quit">退出练习</button></div>'
      : '<div class="actions"><button class="btn btn-primary" data-act="submit">提交答案</button>' +
        '<span class="kbd-hint">' + (q.type === "multi" ? "可多选" : q.type === "fill" ? "回车提交" : "键盘 1–4 选择") + '</span>' +
        '<span class="spacer"></span><button class="btn btn-ghost" data-act="quit">退出</button></div>';

    var explain = session.graded ? renderExplain(q) : "";

    view.innerHTML =
      '<div class="quiz-shell">' + head +
        '<div class="q-card">' + meta +
          '<p class="q-stem">' + esc(q.stem) + '</p>' + code + body + actions + explain +
        '</div>' +
      '</div>';

    if (q.type === "fill" && !session.graded) {
      var inp = document.getElementById("fillInput");
      if (inp) { inp.focus(); inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submitAnswer(); }); }
    }
  }

  function renderExplain(q) {
    var ok = isCorrect(q, session.picked);
    var html = '<div class="explain">' +
      '<div class="explain-head"><span class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "答对了" : "答错了") + '</span>' +
      '<span>解析</span></div>' +
      '<div class="exp-block">' + esc(q.explain || "") + '</div>';

    if (q.optionExplains && q.type !== "fill") {
      html += '<div class="exp-block"><b>逐项看：</b>' + q.optionExplains.map(function (t, i) {
        var mark = q.answer.indexOf(i) >= 0 ? "✓" : "○";
        return '<div class="li"><i>' + mark + '</i><span>' + esc(t) + '</span></div>';
      }).join("") + '</div>';
    }

    if (q.type === "fill") {
      html += '<div class="exp-block"><b>你的答案：</b>' + esc((session.picked[0] || "（空）")) +
        '<br><b>参考答案：</b>' + esc((q.accept && q.accept[0]) || (q.answer && q.answer[0]) || "") + '</div>';
    }

    html += '<div class="exp-src">来源：' + esc(q.source) + ' · 知识点：' + esc(q.kp || "") + '</div></div>';
    return html;
  }

  function submitAnswer() {
    if (!session || session.graded) return;
    var q = currentQ();
    if (q.type === "fill") {
      var inp = document.getElementById("fillInput");
      session.picked = [inp ? inp.value : ""];
      if (!session.picked[0].trim()) { toast("先输入答案"); return; }
    } else if (!session.picked.length) {
      toast("先选一个答案"); return;
    }
    session.graded = true;
    var ok = isCorrect(q, session.picked);
    record(q.id, ok);
    session.results.push({ id: q.id, ok: ok });
    saveResume();
    renderQuiz();
  }

  function nextQuestion() {
    if (!session) return;
    session.idx += 1;
    session.picked = [];
    session.graded = false;
    if (session.idx >= session.ids.length) finishSession();
    else { saveResume(); renderQuiz(); }
  }

  function finishSession() {
    var total = session.results.length;
    var right = session.results.filter(function (r) { return r.ok; }).length;
    resultData = { total: total, right: right, wrong: session.results.filter(function (r) { return !r.ok; }) };
    dropResume(session.key);
    session = null;
    go("/result");
  }

  function renderResult() {
    if (!resultData) { go("/home"); return; }
    var pctv = resultData.total ? Math.round(resultData.right / resultData.total * 100) : 0;

  /* ---------------- 渲染路由 ---------------- */
  function render() {
    var h = hashTo();
    var qi = h.indexOf("?");
    var path = qi >= 0 ? h.slice(0, qi) : h;
    var params = {};
    if (qi >= 0) {
      h.slice(qi + 1).split("&").forEach(function (kv) {
        var p = kv.split("=");
        params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
      });
    }

    // 深链接：直接带参数开始练习（#/quiz?ch=2-1 / #/quiz?smart=1 / #/quiz?q=题目id）
    if (path === "/quiz" && !session) {
      if (params.q && QMAP[params.q]) {
        startSession([params.q], "单题练习", "single", "q:" + params.q);
        return;
      }
      if (params.ch) {
        var chOk = CHAPTERS.some(function (c) { return c.id === params.ch; });
        if (chOk) {
          var c0 = CHAPTERS.filter(function (c) { return c.id === params.ch; })[0];
          startSession(chapterIds(params.ch), c0.short + " · 按章练习", "chapter", "ch:" + params.ch);
          return;
        }
      }
      if (params.smart) {
        startSession(smartIds(10), "智能练习", "smart", "smart");
        return;
      }
      // 刷新或直接打开 /quiz：接着最近一次进度
      var saved = latestResume();
      if (saved) {
        session = {
          key: saved.key, ids: saved.ids, idx: saved.idx, title: saved.title, mode: saved.mode || "practice",
          picked: saved.picked || [], graded: !!saved.graded, results: saved.results || []
        };
      }
    }

    document.body.dataset.route = path;

    var navMap = { "/practice": "practice", "/review": "review", "/stats": "stats", "/me": "me", "/about": "about", "/quiz": "practice", "/result": "practice" };
    Array.prototype.forEach.call(nav.querySelectorAll("a"), function (a) {
      a.classList.toggle("active", a.getAttribute("data-nav") === navMap[path]);
    });

    if (path === "/home" || path === "/") renderHome();
    else if (path === "/practice") renderPractice();
    else if (path === "/quiz") renderQuiz();
    else if (path === "/result") renderResult();
    else if (path === "/review") renderReview();
    else if (path === "/stats") renderStats();
    else if (path === "/me") renderMe();
    else if (path === "/about") renderAbout();
    else { location.hash = "/home"; }

    // 选择题键盘操作
    window.onkeydown = function (e) {
      if (document.body.dataset.route !== "/quiz" || !session) return;
      if (e.target && e.target.tagName === "INPUT") return;
      var q = currentQ();
      if (!q) return;
      if (!session.graded && q.type !== "fill" && /^[1-4]$/.test(e.key)) {
        var idx = parseInt(e.key, 10) - 1;
        if (idx < q.options.length) { e.preventDefault(); toggleOption(idx); }
      } else if (e.key === "Enter") {
        if (session.graded) { e.preventDefault(); nextQuestion(); }
        else if (q.type !== "fill") { e.preventDefault(); submitAnswer(); }
      }
    };
  }

  function toggleOption(i) {
    if (!session || session.graded) return;
    var q = currentQ();
    if (q.type === "multi") {
      var p = session.picked.indexOf(i);
      if (p >= 0) session.picked.splice(p, 1); else session.picked.push(i);
    } else {
      session.picked = [i];
    }
    saveResume();
    renderQuiz();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");

    if (act === "opt") { toggleOption(parseInt(t.getAttribute("data-i"), 10)); return; }
    if (act === "submit") { submitAnswer(); return; }
    if (act === "next") { nextQuestion(); return; }
    if (act === "quit") { saveResume(); session = null; go("/practice"); return; }
    if (act === "home") { go("/home"); return; }
    if (act === "start-smart") { startSession(smartIds(10), "智能练习", "smart", "smart"); return; }
    if (act === "restart-ch") {
      var rch = t.getAttribute("data-ch");
      dropResume("ch:" + rch);
      var rc = CHAPTERS.filter(function (x) { return x.id === rch; })[0];
      startSession(chapterIds(rch), rc ? rc.short + " · 按章练习" : "按章练习", "chapter", "ch:" + rch);
      return;
    }
    if (act === "start-ch") {
      var ch = t.getAttribute("data-ch");
      var c = CHAPTERS.filter(function (x) { return x.id === ch; })[0];
      startSession(chapterIds(ch), c ? c.short + " · 按章练习" : "按章练习", "chapter", "ch:" + ch);
      return;
    }
    if (act === "start-review") {
      var ids = wrongIds();
      if (!ids.length) { toast("错题本是空的"); return; }
      startSession(shuffle(ids), "错题重练", "review", "review");
      return;
    }
    if (act === "start-q") {
      var qid = t.getAttribute("data-q");
      if (qid && QMAP[qid]) startSession([qid], "单题重做", "single", "q:" + qid);
      return;
    }
    if (act === "resume") {
      var rk = t.getAttribute("data-key");
      var rr = rk ? resumeFor(rk) : latestResume();
      if (!rr) { toast("没有未完成的练习"); return; }
      session = {
        key: rk || rr.key, ids: rr.ids, idx: rr.idx, title: rr.title, mode: rr.mode || "practice",
        picked: rr.picked || [], graded: !!rr.graded, results: rr.results || []
      };
      resultData = null;
      go("/quiz");
      return;
    }
    if (act === "reset") {
      if (confirm("确定清空本机的答题记录、错题和连击吗？此操作不能撤销。")) {
        state = defaultState();
        save();
        toast("已清空");
        render();
      }
      return;
    }
    if (act === "modal-close") { closeModal(); return; }
    if (act === "mode") {
      acctMode = t.getAttribute("data-mode") || "signin";
      renderModal();
      return;
    }
    if (act === "cfg-save") {
      var urlEl = document.getElementById("cfgUrl");
      var keyEl = document.getElementById("cfgKey");
      var url = (urlEl && urlEl.value || "").trim().replace(/\/+$/, "");
      var key = (keyEl && keyEl.value || "").trim();
      if (!/^https:\/\/.+/.test(url)) { formMsg("Project URL 需以 https:// 开头"); return; }
      if (key.length < 20) { formMsg("anon key 看起来不对，请重新复制"); return; }
      Cloud.setCfg({ url: url, key: key });
      formMsg("已保存，可以注册或登录了", true);
      renderModal();
      return;
    }
    if (act === "cfg-reset") {
      Cloud.signOut();
      Cloud.setCfg({});
      updateAcctUI();
      renderModal();
      return;
    }
    if (act === "auth-submit") { doAuth(); return; }
    if (act === "sync-now") {
      setSyncMsg("同步中…", true);
      syncNow({ render: false }).then(function () { renderModal(); });
      return;
    }
    if (act === "sign-out") {
      Cloud.signOut();
      updateAcctUI();
      renderModal();
      toast("已退出登录，进度仍在本机");
      return;
    }
    if (act === "me-mode") {
      meMode = t.getAttribute("data-mode") || "signin";
      renderMe();
      return;
    }
    if (act === "me-cfg-save") {
      var mu = document.getElementById("meUrl");
      var mk = document.getElementById("meKey");
      var murl = (mu && mu.value || "").trim().replace(/\/+$/, "");
      var mkey = (mk && mk.value || "").trim();
      if (!/^https:\/\/.+/.test(murl)) { meMsg("Project URL 需以 https:// 开头"); return; }
      if (mkey.length < 20) { meMsg("anon key 看起来不对，请重新复制"); return; }
      Cloud.setCfg({ url: murl, key: mkey });
      meCfgOpen = false;
      updateAcctUI();
      renderMe();
      toast("云端配置已保存");
      return;
    }
    if (act === "me-auth") { meAuth(); return; }
    if (act === "me-sync") {
      setSyncMsg("同步中…", true);
      syncNow({ render: true });
      return;
    }
    if (act === "me-signout") {
      Cloud.signOut();
      updateAcctUI();
      renderMe();
      toast("已退出登录，进度仍在本机");
      return;
    }

  /* ---------------- 云端账号与同步 ---------------- */
  var syncTimer = null;
  var syncing = false;
  var acctMode = "signin";
  var meMode = "signin";
  var meCfgOpen = false;
  var modalView = "acct";

  function pushLookNow() {
    if (!cloudReady() || !window.Cloud || !Cloud.pushLook) return;
    var look = state.look || { img: "", ts: 0 };
    Cloud.pushLook(look.img || "", look.ts || 0).then(function () {
      setSyncMsg("背景已同步到云端", true);
    }).catch(function (e) {
      setSyncMsg("背景同步失败：" + ((e && e.message) || "未知错误"), false);
    });
  }

  var cloudLookTs = 0;
  var lookPushed = false;

  function pullLookNow() {
    if (!cloudReady() || !window.Cloud || !Cloud.pullLook) return Promise.resolve();
    return Cloud.pullLook().then(function (rows) {
      var row = rows && rows[0];
      if (!row) return;
      cloudLookTs = row.ts || 0;
      if (row.img && cloudLookTs > (((state.look && state.look.ts) || 0))) {
        state.look = { img: row.img, ts: cloudLookTs };
        save();
        applyLook();
      }
    }).catch(function () { /* 忽略：老项目可能还没建表 */ });
  }

  function pushLookIfNewer() {
    if (!cloudReady() || !window.Cloud || !Cloud.pushLook) return Promise.resolve();
    var look = state.look || { img: "", ts: 0 };
    if ((look.ts || 0) <= cloudLookTs) return Promise.resolve();
    return Cloud.pushLook(look.img || "", look.ts || 0).then(function () {
      cloudLookTs = look.ts || 0;
      lookPushed = true;
    }).catch(function (e) {
      setSyncMsg("背景同步失败：" + ((e && e.message) || "未知错误"), false);
    });
  }

  function cloudReady() {
    return !!(window.Cloud && Cloud.configured() && Cloud.user());
  }

  function mergeCloud(local, cloud) {
    var out = JSON.parse(JSON.stringify(local || {}));
    out.attempts = out.attempts || {};
    out.days = out.days || {};
    if (!cloud) return out;
    var A = cloud.attempts || {};
    Object.keys(A).forEach(function (id) {
      var a = A[id], b = out.attempts[id];
      if (!b || (a.ts || 0) > (b.ts || 0)) out.attempts[id] = a;
    });
    var D = cloud.days || {};
    Object.keys(D).forEach(function (k) {
      var a = D[k], b = out.days[k];
      if (!b) out.days[k] = a;
      else out.days[k] = { n: Math.max(b.n || 0, a.n || 0), c: Math.max(b.c || 0, a.c || 0) };
    });
    out.streak = Math.max(out.streak || 0, cloud.streak || 0);
    out.bestStreak = Math.max(out.bestStreak || 0, cloud.bestStreak || 0);
    var cn = cloud.profile && cloud.profile.name;
    var cnTs = (cloud.profile && cloud.profile.nameTs) || 0;
    if (cn && cnTs > (((out.profile && out.profile.nameTs) || 0))) {
      out.profile = out.profile || {};
      out.profile.name = cn;
      out.profile.nameTs = cnTs;
    }
    var av = cloud.profile && cloud.profile.avatar;
    var avTs = (cloud.profile && cloud.profile.avatarTs) || 0;
    if (av && avTs > (((out.profile && out.profile.avatarTs) || 0))) {
      out.profile = out.profile || {};
      out.profile.avatar = av;
      out.profile.avatarTs = avTs;
    }
    out.resume = out.resume || loadResumes();
    var R = cloud.resume || {};
    var rkeys = {};
    Object.keys(out.resume).forEach(function (k) { rkeys[k] = 1; });
    Object.keys(R).forEach(function (k) { rkeys[k] = 1; });
    Object.keys(rkeys).forEach(function (k) {
      var a = out.resume[k], b = R[k];
      if (!b) return;
      if (!a) { out.resume[k] = b; return; }
      var wa = a.ts || 0, wb = b.ts || 0;
      var win = (wb > wa) ? b : a;
      var other = (win === a) ? b : a;
      if (win.ids && win.ids.length && other && other.ids && other.ids.length
        && (other.idx || 0) > (win.idx || 0)) win = other;
      if (!win.ids || !win.ids.length) delete out.resume[k];
      else out.resume[k] = win;
    });
    return out;
  }

  function payload() {
    return {
      attempts: state.attempts,
      days: state.days,
      streak: state.streak,
      bestStreak: state.bestStreak,
      profile: {
        avatar: avatarSrc() || "",
        avatarTs: (state.profile && state.profile.avatarTs) || 0,
        name: (state.profile && state.profile.name) || "",
        nameTs: (state.profile && state.profile.nameTs) || 0
      },
      resume: loadResumes(),
      v: 1
    };
  }

  function syncNow(opts) {
    opts = opts || {};
    if (!cloudReady() || syncing) return Promise.resolve();
    syncing = true;
    var cloudCount = 0;
    var resumeChanged = false;
    lookPushed = false;
    return Cloud.ensure().then(function () {
      return pullLookNow();
    }).then(function () {
      return Cloud.pull().then(function (rows) {
        var cloud = rows && rows[0] ? rows[0].data : null;
        cloudCount = (cloud && cloud.attempts) ? Object.keys(cloud.attempts).length : 0;
        var merged = mergeCloud(state, cloud);
        state.attempts = merged.attempts;
        state.days = merged.days;
        state.streak = merged.streak;
        state.bestStreak = merged.bestStreak;
        state.profile = merged.profile || state.profile || {};
        var beforeR = JSON.stringify(loadResumes());
        writeResumes(merged.resume || loadResumes());
        resumeChanged = JSON.stringify(loadResumes()) !== beforeR;
        save();
        return Cloud.push(payload()).then(function () {
          return pushLookIfNewer();
        });
      });
    }).then(function () {
      setSyncMsg("已同步 · 云端 " + cloudCount + " 题" + (lookPushed ? " · 背景已上传" : "") + " · " + new Date().toTimeString().slice(0, 5), true);
      if (opts.render || (resumeChanged && /^#\/(home|practice)/.test(String(location.hash || "#/home")))) render();
    }).catch(function (e) {
      setSyncMsg((e && e.message) || "同步失败", false);
    }).then(function () { syncing = false; });
  }

  function scheduleSync() {
    if (!cloudReady()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncNow({ render: false }); }, 1200);
  }

  function refreshViews() {
    updateAcctUI();
    if (String(location.hash).indexOf("#/me") === 0) renderMe();
  }

  function meMsg(text, ok) {

  function applyLook() {
    var img = (state.look && state.look.img) || "";
    var root = document.documentElement;
    if (img) {
      root.classList.add("has-bg");
      root.style.setProperty("--user-bg", 'url("' + img + '")');
    } else {
      root.classList.remove("has-bg");
      root.style.removeProperty("--user-bg");
    }
  }

      if (el) { el.textContent = lastSyncText; el.classList.toggle("ok", lastSyncOk); }
    });

  function escAttr(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

    return (state.profile && state.profile.avatar) || "";

  function readLook(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast("请选择图片文件"); return; }
    if (file.size > 20 * 1024 * 1024) { toast("图片太大，换一张 20MB 以内的"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 1600;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        var url = c.toDataURL("image/jpeg", 0.72);
        state.look = { img: url, ts: Date.now() };
        save();
        applyLook();
        refreshViews();
        pushLookNow();
        toast("背景已更新（" + Math.round(url.length / 1024) + " KB）");
      };
      img.onerror = function () { toast("这张图读不出来，换一张试试"); };
      img.src = reader.result;
    };
    reader.onerror = function () { toast("读文件失败"); };
    reader.readAsDataURL(file);
  }

  function readAvatar(file, cb) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast("请选择图片文件"); return; }
    if (file.size > 8 * 1024 * 1024) { toast("图片太大，换一张 8MB 以内的"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var S = 160;
        var c = document.createElement("canvas");
        c.width = S; c.height = S;
        var ctx = c.getContext("2d");
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, S, S);
        cb(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function () { toast("这张图读不出来，换一张试试"); };
      img.src = reader.result;
    };
    reader.onerror = function () { toast("读文件失败"); };
    reader.readAsDataURL(file);
  }

  function meAuth() {
    var emailEl = document.getElementById("meEmail");
    var pwEl = document.getElementById("mePw");
    var email = (emailEl && emailEl.value || "").trim();
    var pw = (pwEl && pwEl.value || "");
    if (!email || !pw) { meMsg("请填写邮箱和密码"); return; }
    meMsg("处理中…", true);
    var p = meMode === "signin" ? Cloud.signIn(email, pw) : Cloud.signUp(email, pw);
    p.then(function () {
      if (meMode === "signup" && !Cloud.user()) {
        meMsg("注册成功，请到邮箱点确认链接后再登录", true);
        return;
      }
      updateAcctUI();
      meMsg("登录成功，正在同步…", true);
      return syncNow({ render: false }).then(function () {
        renderMe();
        toast("已登录，进度已合并");
      });
    }).catch(function (e) {
      meMsg((e && e.message) || "操作失败");
    });
  }

  function doAuth() {
    var emailEl = document.getElementById("authEmail");
    var pwEl = document.getElementById("authPw");
    var email = (emailEl && emailEl.value || "").trim();
    var pw = (pwEl && pwEl.value || "");
    if (!email || !pw) { formMsg("请填写邮箱和密码"); return; }
    formMsg("处理中…", true);
    var p = acctMode === "signin" ? Cloud.signIn(email, pw) : Cloud.signUp(email, pw);
    p.then(function (res) {
      if (acctMode === "signup" && !Cloud.user()) {
        formMsg("注册成功，请到邮箱点确认链接后再登录", true);
        return;
      }
      formMsg("登录成功，正在同步…", true);
      updateAcctUI();
      return syncNow({ render: false }).then(function () {
        closeModal();
        render();
        toast("已登录，进度已合并");
      });
    }).catch(function (e) {
      formMsg((e && e.message) || "操作失败");
    });
  }

  if (acctBtn) acctBtn.addEventListener("click", function () { location.hash = "/me"; });
  if (modal) {

        doAuth();
      }
    });

    if (document.hidden && cloudReady()) syncNow({ render: false });
  });
  window.addEventListener("online", function () {
    if (cloudReady()) syncNow({ render: false });
  });
  if (cloudReady()) {
    initialSync = syncNow({ render: false }).then(function () { initialSyncDone = true; });
  } else {
    initialSyncDone = true;
  }
  render();
})();

</script>
</body>
</html>
